name: rig-validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: install rig
        run: go install github.com/AindriuB/rig/cmd/rig@v0.5.3
      - name: validate workflows
        run: |
          shopt -s nullglob
          files=(workflows/*.json)
          if [ ${#files[@]} -eq 0 ]; then
            echo "no workflows/*.json found" >&2
            exit 1
          fi
          for f in "${files[@]}"; do
            echo "validating $f"
            out=$("$(go env GOPATH)/bin/rig" workflow validate "$f" --json) || { echo "$out"; exit 1; }
            echo "$out"
            echo "$out" | grep -q '"valid": true' || exit 1
          done
